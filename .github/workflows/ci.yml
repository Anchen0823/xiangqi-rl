name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run native:configure
      - run: npm test
      - run: npm run build

  trainer-cpu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --no-deps -e trainer
      - run: python -m pip install "numpy>=2.0,<3"
      - run: python -m pip install "zstandard>=0.22,<1"
      - run: python -m unittest discover -s trainer/tests -v
