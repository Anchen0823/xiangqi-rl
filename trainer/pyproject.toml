[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xiangqi-nnue"
version = "0.1.0"
description = "Reproducible NNUE training tools for Xiangqi RL"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0,<3", "torch==2.12.1", "zstandard>=0.22,<1"]

[project.scripts]
xiangqi-hardware = "xiangqi_nnue.hardware:main"
xiangqi-features = "xiangqi_nnue.features:main"
xiangqi-label = "xiangqi_nnue.label:main"
xiangqi-selfplay = "xiangqi_nnue.selfplay:main"
xiangqi-train = "xiangqi_nnue.train:main"
xiangqi-smoke = "xiangqi_nnue.smoke:main"
xiangqi-teacher = "xiangqi_nnue.teacher:main"
xiangqi-export-nnue = "xiangqi_nnue.export_nnue:main"
xiangqi-parity = "xiangqi_nnue.parity:main"
xiangqi-match = "xiangqi_nnue.match:main"
xiangqi-inspect = "xiangqi_nnue.inspect:main"
xiangqi-diff = "xiangqi_nnue.diff:main"

[tool.setuptools.packages.find]
where = ["src"]
